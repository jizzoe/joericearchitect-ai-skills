name: OpenSpec Validate

on:
  pull_request:
    paths:
      - "openspec/**"
      - "skills/**"
      - "schemas/**"
      - "config/**"
      - ".agents/**"
      - ".claude/**"
      - "scripts/**"
      - "evals/**"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  openspec-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @fission-ai/openspec@1.8.0
      - run: node scripts/validation/validate-skill-metadata.mjs
      - run: node scripts/validation/validate-shared-guardrails.mjs
      - run: node scripts/validation/validate-runtime-references.mjs
      - run: node --test scripts/validation/test/skill-metadata.test.mjs scripts/validation/test/validate-runtime-references.test.mjs
      - run: node --test evals/skills/base-skill-contracts/run-fixtures.test.mjs evals/skills/shared-skill-guardrails/run-fixtures.test.mjs evals/skills/autonomous-goal-runner/run-fixtures.test.mjs evals/skills/autonomous-goal-runner/operation-check.test.mjs evals/skills/implementation-quality/run-fixtures.test.mjs
      - run: openspec validate --all --strict
