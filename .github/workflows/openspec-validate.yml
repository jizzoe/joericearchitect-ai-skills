name: OpenSpec Validate

on:
  pull_request:
    paths:
      - "openspec/**"
      - "skills/**"
      - ".agents/**"
      - ".claude/**"
      - "scripts/**"
      - "evals/**"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  openspec-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @fission-ai/openspec@1.8.0
      - run: node scripts/validation/validate-skill-metadata.mjs
      - run: node --test scripts/validation/test/skill-metadata.test.mjs
      - run: openspec validate --all --strict
